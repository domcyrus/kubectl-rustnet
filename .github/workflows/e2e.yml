name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

# Superseded PRs can stop; pushes and manual runs remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Build plugin
        run: go build -o kubectl-rustnet ./cmd/kubectl-rustnet

      - name: Install kind
        run: go install sigs.k8s.io/kind@latest

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - name: Create kind cluster
        run: kind create cluster --config e2e/kind-config.yaml --wait 60s

      - name: Pull and load rustnet image
        run: |
          docker pull ghcr.io/domcyrus/rustnet:latest || true
          kind load docker-image ghcr.io/domcyrus/rustnet:latest || true

      - name: Run e2e tests
        run: go test ./e2e/ -v -timeout 300s
        env:
          KUBECTL_RUSTNET_BIN: ${{ github.workspace }}/kubectl-rustnet

      - name: Cleanup
        if: always()
        run: kind delete cluster
